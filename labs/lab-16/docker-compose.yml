services:
  mongo16:
    image: mongo:7
    container_name: lab16-mongo
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 10

  cassandra16:
    image: cassandra:4.1
    container_name: lab16-cassandra
    environment:
      MAX_HEAP_SIZE: 512M
      HEAP_NEWSIZE: 128M
    healthcheck:
      test: ["CMD-SHELL", "cqlsh -e 'describe keyspaces' || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 18

  neo4j16:
    image: neo4j:5
    container_name: lab16-neo4j
    environment:
      NEO4J_AUTH: neo4j/Neo4jPass123!
      NEO4J_server_memory_heap_initial__size: 256m
      NEO4J_server_memory_heap_max__size: 512m
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p Neo4jPass123! 'RETURN 1' || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 15

  lab16-app:
    build: .
    image: rayhaan369/nosql-lab-16:latest
    depends_on:
      mongo16:
        condition: service_healthy
      cassandra16:
        condition: service_healthy
      neo4j16:
        condition: service_healthy
    environment:
      MONGO_URI: "mongodb://mongo16:27017/?maxPoolSize=10"
      CASSANDRA_HOST: "cassandra16"
      CASSANDRA_PORT: "9042"
      NEO4J_URI: "bolt://neo4j16:7687"
      NEO4J_USER: "neo4j"
      NEO4J_PASS: "Neo4jPass123!"
      DB_NAME: "lab_16"