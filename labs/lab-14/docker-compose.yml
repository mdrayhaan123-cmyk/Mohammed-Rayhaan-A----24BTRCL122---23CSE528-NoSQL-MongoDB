services:
  mongo14:
    image: mongo:7
    container_name: lab14-mongo
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 10

  rs-init:
    image: mongo:7
    depends_on:
      mongo14:
        condition: service_healthy
    entrypoint: >
      mongosh --host mongo14:27017 --quiet --eval '
      rs.initiate({_id: "rs0", members: [{_id: 0, host: "mongo14:27017"}]});
      sleep(3000);
      '

  lab14-app:
    build: .
    image: rayhaan369/nosql-lab-14:latest
    depends_on:
      rs-init:
        condition: service_completed_successfully
    environment:
      MONGO_URI: "mongodb://mongo14:27017/lab_14?replicaSet=rs0"
      DB_NAME: "lab_14"
      MONITOR_SAMPLES: "2"
      MONITOR_INTERVAL_SEC: "2"