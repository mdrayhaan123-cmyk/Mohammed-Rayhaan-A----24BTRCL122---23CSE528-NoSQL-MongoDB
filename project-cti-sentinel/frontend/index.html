    async function checkHealth() {
      try {
        const r = await fetch(`${API}/health?t=${Date.now()}`);
        const d = await r.json();
        document.getElementById(&quot;healthPill&quot;).textContent = `MongoDB: ${d.mongodb} | Host: ${d.host_platform} | Docs: ${d.knowledge_chunks}`;
      } catch (e) {
        document.getElementById(&quot;healthPill&quot;).textContent = &quot;Backend Offline (Start port 8000)&quot;;
      }
    }

    async function loadFindings() {
      const plat = document.getElementById(&quot;platformSel&quot;).value;
      try {
        const r = await fetch(`${API}/findings?platform=${plat}&amp;t=${Date.now()}`);
        const d = await r.json();
        const wrap = document.getElementById(&quot;findingsList&quot;);
        wrap.innerHTML = (d.findings || []).map(f => {
          const isFixed = f.status === &quot;MITIGATED&quot;;
          return `
            &lt;div class=&quot;bg-[#060b16] border ${isFixed ? &#39;border-emerald-800/70&#39; : &#39;border-amber-700/60&#39;} rounded-xl p-3 space-y-1.5&quot;>
              &lt;div class=&quot;flex items-center justify-between text-[11px] font-mono&quot;>
                &lt;span class=&quot;text-sky-400 font-bold&quot;>${f.finding_id} &amp;bull; ${f.platform}&lt;/span>
                &lt;span class=&quot;px-2 py-0.5 rounded ${isFixed ? &#39;bg-emerald-950 text-emerald-400&#39; : &#39;bg-rose-950 text-rose-400&#39;} font-bold&quot;>${f.status}&lt;/span>

              &lt;div class=&quot;text-[11px] text-slate-400&quot;>${f.detail}&lt;/div>
              ${isFixed
                ? `&lt;div class=&quot;text-[11px] text-emerald-400 font-mono&quot;>Mitigated: ${f.remediation_action}&lt;/div>`
                : `&lt;button onclick=&quot;quickAsk(&#39;confirm ${f.finding_id}&#39;)&quot; class=&quot;w-full mt-1 py-1.5 rounded-lg bg-emerald-500/20 hover:bg-emerald-500/30 border border-emerald-500/50 text-emerald-300 font-bold text-xs cursor-pointer&quot;>Confirm &amp;amp; Mitigate via Chat&lt;/button>`
              }
            &lt;/div>`;
        }).join(&quot;&quot;);
      } catch (e) {}
    }

    async function triggerScan(forceRescan = false) {
      const plat = document.getElementById(&quot;platformSel&quot;).value;
      const scanPath = document.getElementById(&quot;scanPathInput&quot;).value;
      const banner = document.getElementById(&quot;scanStatusBanner&quot;);
      const btn = document.getElementById(&quot;scanBtn&quot;);
      btn.textContent = &quot;Scanning...&quot;;
      banner.textContent = `Scanning system (${scanPath}) &amp; auditing live OS ports/policies...`;
      try {
        const r = await fetch(`${API}/scan/trigger`, {
          method: &quot;POST&quot;,
          headers: { &quot;Content-Type&quot;: &quot;application/json&quot; },
          body: JSON.stringify({ platform: plat, project_path: scanPath, force_rescan: forceRescan })
        });
        const d = await r.json();
        const t = d.telemetry || {};
        const pendingCount = (d.findings || []).filter(x => x.status !== &quot;MITIGATED&quot;).length;
        banner.innerHTML = `&lt;strong>Scan Complete (${new Date().toLocaleTimeString()})&lt;/strong>&lt;br/>Host: ${t.host || &#39;Local&#39;} | Open Ports: [${(t.open_ports || []).join(&#39;, &#39;)}]&lt;br/>ExecPolicy: ${t.execution_policy || &#39;N/A&#39;} | Defender RT: ${t.defender_realtime || &#39;N/A&#39;} | Pending: ${pendingCount}`;
      } catch (e) {
        banner.textContent = &quot;Scan error: ensure Uvicorn is running on port 8000.&quot;;
      } finally {
        btn.textContent = &quot;Scan System&quot;;
        await loadFindings();
        await checkHealth();
      }
    }

    function appendBubble(role, text, meta = &quot;&quot;) {
      const box = document.getElementById(&quot;chatBox&quot;);
      const isUser = role === &quot;user&quot;;
      const safe = text.replace(/&lt;/g, &quot;&amp;lt;&quot;).replace(/>/g, &quot;&amp;gt;&quot;).replace(/\n/g, &quot;&lt;br/>&quot;);
      box.innerHTML += `
        &lt;div class=&quot;${isUser ? &#39;bg-sky-950/60 border-sky-800/70 ml-10&#39; : &#39;bg-[#060b16] border-slate-800 mr-6&#39;} border rounded-2xl p-4&quot;>
          &lt;div class=&quot;text-[11px] font-mono ${isUser ? &#39;text-sky-400&#39; : &#39;text-emerald-400&#39;} font-bold mb-1&quot;>
            ${isUser ? &#39;ANALYST&#39; : &#39;CTI SENTINEL AI&#39;} ${meta ? &#39;&amp;bull; &#39; + meta : &#39;&#39;}
          &lt;/div>
          &lt;div class=&quot;text-slate-100 leading-relaxed&quot;>${safe}&lt;/div>
        &lt;/div>`;
      box.scrollTop = box.scrollHeight;
    }

    function quickAsk(txt) {
      document.getElementById(&quot;chatInput&quot;).value = txt;
      sendChat(new Event(&quot;submit&quot;));
    }

    async function sendChat(e) {
      e.preventDefault();
      const inp = document.getElementById(&quot;chatInput&quot;);
      const msg = inp.value.trim();
      if (!msg) return;
      inp.value = &quot;&quot;;
      appendBubble(&quot;user&quot;, msg);

      const payload = {
        message: msg,
        session_id: document.getElementById(&quot;sessionInput&quot;).value.trim() || &quot;default&quot;,
        platform: document.getElementById(&quot;platformSel&quot;).value,
        lifecycle: document.getElementById(&quot;lifecycleSel&quot;).value
      };
      try {
        const r = await fetch(`${API}/chat`, {
          method: &quot;POST&quot;,
          headers: { &quot;Content-Type&quot;: &quot;application/json&quot; },
          body: JSON.stringify(payload)
        });
        const d = await r.json();
        const refs = (d.sources || []).map(s => `${s.doc_id} (${s.similarity})`).join(&quot;, &quot;);
        appendBubble(&quot;assistant&quot;, d.answer || d.detail, `${d.engine || &#39;RAG&#39;} ${refs ? &#39;| Sources: &#39; + refs : &#39;&#39;}`);
        await loadFindings();
        await checkHealth();
      } catch (err) {
        appendBubble(&quot;assistant&quot;, &quot;Connection error: ensure FastAPI server is running on port 8000.&quot;);
      }
    }

    checkHealth();
    loadFindings();
  &lt;/script>

  <script>
    function switchPortalTab(tab) {
      document.getElementById('tab-cti').classList.toggle('active', tab === 'cti');
      document.getElementById('tab-labs').classList.toggle('active', tab === 'labs');
      document.getElementById('view-cti').classList.toggle('active', tab === 'cti');
      document.getElementById('view-labs').classList.toggle('active', tab === 'labs');
    }
    window.addEventListener('message', function(e) {
      if (e.data && e.data.type === 'SWITCH_PORTAL_TAB') {
        switchPortalTab(e.data.tab);
      }
    });
  </script>
</body>
</html>
